<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effect Tracker</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><img src="./icon.svg" alt=""/><div><h1>Effect Tracker</h1></div></div>
    </header>

    <div class="character-assignment">
      <h2 id="character-name">Select a character</h2>
      <button id="assign-character" class="assign-button" type="button" hidden>Assign</button>
    </div>

    <section class="panel">
      <div class="section-title"><h2>Current</h2></div>
      <div id="current-effects" class="empty">Select a character token on the map, then press Assign to see its current effects.</div>
    </section>

    <div id="bleed-controls" class="bleed-controls">
      <div class="effect-heading"><img class="drop" src="./effects/Bleed.svg" alt="Bleed" /><div><h3>Bleed</h3><p class="muted">Choose a power to apply it to this character</p></div></div>
      <div class="tiers" id="tiers">
        <button data-tier="1">3x1</button>
        <button data-tier="2">3x2</button>
        <button data-tier="3">3x3</button>
        <button data-tier="4">3x4</button>
        <button data-tier="5">3x5</button>
      </div>
      <p class="hint">Each click adds a separate Bleed. Existing Bleeds are never replaced.</p>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import("./main.js?rev=20261124-cleanui5").catch((error) => {
      console.error("Effect Tracker module failed to load:", error);
    });
  </script>
</body>
</html>
