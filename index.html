<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effect Tracker</title>
  <link rel="stylesheet" href="./style.css?rev=20261126-v016-modifiers" />
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><img src="./icon.svg" alt=""/><div><h1>Effect Tracker</h1></div></div>
    </header>

    <div class="character-assignment">
      <h2 id="character-name">Select a character</h2>
      <div class="character-actions"><button id="assign-character" class="assign-button" type="button" hidden>Assign</button><button id="add-to-initiative" class="assign-button initiative-button" type="button" aria-label="Add to Initiative" title="Add to Initiative" hidden>+</button></div>
    </div>

    <section class="panel">
      <div class="section-title"><h2>Current</h2></div>
      <div id="current-effects" class="empty">Select a character token on the map, then press Assign to see its current effects.</div>
    </section>

    <div id="bleed-controls" class="bleed-controls">
      <div class="effect-columns">
        <div class="effect-column effect-bleed">
          <img class="drop" src="./effects/Bleed.svg" alt="Bleed" />
          <div class="tiers">
            <button data-effect="bleed" data-tier="1">3×1</button>
            <button data-effect="bleed" data-tier="2">3×2</button>
            <button data-effect="bleed" data-tier="3">3×3</button>
            <button data-effect="bleed" data-tier="4">3×4</button>
            <button data-effect="bleed" data-tier="5">3×5</button>
          </div>
        </div>
        <div class="effect-column effect-poison">
          <img class="drop" src="./effects/Poison.svg" alt="Poison" />
          <div class="tiers">
            <button data-effect="poison" data-tier="1">3×1</button>
            <button data-effect="poison" data-tier="2">3×2</button>
            <button data-effect="poison" data-tier="3">3×3</button>
            <button data-effect="poison" data-tier="4">3×4</button>
            <button data-effect="poison" data-tier="5">3×5</button>
          </div>
        </div>
        <div class="effect-column effect-fire">
          <img class="drop" src="./effects/Fire.svg" alt="Fire" />
          <div class="tiers">
            <button data-effect="fire" data-tier="1">3×1</button>
            <button data-effect="fire" data-tier="2">3×2</button>
            <button data-effect="fire" data-tier="3">3×3</button>
            <button data-effect="fire" data-tier="4">3×4</button>
            <button data-effect="fire" data-tier="5">3×5</button>
          </div>
        </div>
        <div class="effect-column effect-regen">
          <img class="drop" src="./effects/Regen.svg" alt="Regen" />
          <div class="tiers">
            <button data-effect="regen" data-tier="1">3×1</button>
            <button data-effect="regen" data-tier="2">3×2</button>
            <button data-effect="regen" data-tier="3">3×3</button>
            <button data-effect="regen" data-tier="4">3×4</button>
            <button data-effect="regen" data-tier="5">3×5</button>
          </div>
        </div>
      </div>
      <div class="value-effect-board">
        <div class="value-effect-column" data-effect="stunt"><img class="drop" src="./effects/Stunt.svg" alt="Stunt"/><div class="value-buttons"><button data-effect="stunt" data-value="0">0</button><button data-effect="stunt" data-value="1">1</button><button data-effect="stunt" data-value="2">2</button><button data-effect="stunt" data-value="3">3</button><button data-effect="stunt" data-value="4">4</button><button data-effect="stunt" data-value="5">5</button><button data-effect="stunt" data-value="6">6</button><button data-effect="stunt" data-value="7">7</button><button data-effect="stunt" data-value="8">8</button><button data-effect="stunt" data-value="9">9</button></div></div>
        <div class="value-effect-column" data-effect="root"><img class="drop" src="./effects/Root.svg" alt="Root"/><div class="value-buttons"><button data-effect="root" data-value="0">0</button><button data-effect="root" data-value="1">1</button><button data-effect="root" data-value="2">2</button><button data-effect="root" data-value="3">3</button><button data-effect="root" data-value="4">4</button><button data-effect="root" data-value="5">5</button><button data-effect="root" data-value="6">6</button><button data-effect="root" data-value="7">7</button><button data-effect="root" data-value="8">8</button><button data-effect="root" data-value="9">9</button></div></div>
        <div class="value-effect-column" data-effect="blind"><img class="drop" src="./effects/Blind.svg" alt="Blind"/><div class="value-buttons"><button data-effect="blind" data-value="0">0</button><button data-effect="blind" data-value="1">1</button><button data-effect="blind" data-value="2">2</button><button data-effect="blind" data-value="3">3</button><button data-effect="blind" data-value="4">4</button><button data-effect="blind" data-value="5">5</button><button data-effect="blind" data-value="6">6</button><button data-effect="blind" data-value="7">7</button><button data-effect="blind" data-value="8">8</button><button data-effect="blind" data-value="9">9</button></div></div>
        <div class="value-effect-column" data-effect="silent"><img class="drop" src="./effects/Silent.svg" alt="Silent"/><div class="value-buttons"><button data-effect="silent" data-value="0">0</button><button data-effect="silent" data-value="1">1</button><button data-effect="silent" data-value="2">2</button><button data-effect="silent" data-value="3">3</button><button data-effect="silent" data-value="4">4</button><button data-effect="silent" data-value="5">5</button><button data-effect="silent" data-value="6">6</button><button data-effect="silent" data-value="7">7</button><button data-effect="silent" data-value="8">8</button><button data-effect="silent" data-value="9">9</button></div></div>
      </div>
    </div>

    <div id="third-effect-controls" hidden>
    <div class="value-effect-board third-effect-board">
        <div class="value-effect-column" data-effect="gel"><img class="drop" src="./effects/Gel.svg" alt="Gel"/><div class="value-buttons"><button data-effect="gel" data-value="0">0</button><button data-effect="gel" data-value="1">1</button><button data-effect="gel" data-value="2">2</button><button data-effect="gel" data-value="3">3</button><button data-effect="gel" data-value="4">4</button><button data-effect="gel" data-value="5">5</button><button data-effect="gel" data-value="6">6</button><button data-effect="gel" data-value="7">7</button><button data-effect="gel" data-value="8">8</button><button data-effect="gel" data-value="9">9</button></div></div>
        <div class="effect-column effect-mark"><img class="drop" src="./effects/Mark.svg" alt="Mark"/><div class="tiers"><button data-effect="mark" data-tier="1">3×1</button><button data-effect="mark" data-tier="2">3×2</button><button data-effect="mark" data-tier="3">3×3</button><button data-effect="mark" data-tier="4">3×4</button><button data-effect="mark" data-tier="5">3×5</button></div></div>
        <div class="effect-column effect-horror"><img class="drop" src="./effects/Horror.svg" alt="Horror"/><div class="tiers"><button data-effect="horror" data-tier="1">3×1</button><button data-effect="horror" data-tier="2">3×2</button><button data-effect="horror" data-tier="3">3×3</button><button data-effect="horror" data-tier="4">3×4</button><button data-effect="horror" data-tier="5">3×5</button></div></div>
        <div class="effect-column effect-shield"><img class="drop" src="./effects/Shield.svg" alt="Shield"/><div class="tiers"><button data-effect="shield" data-tier="1">3×1</button><button data-effect="shield" data-tier="2">3×2</button><button data-effect="shield" data-tier="3">3×3</button><button data-effect="shield" data-tier="4">3×4</button><button data-effect="shield" data-tier="5">3×5</button></div></div>
      </div>
    <section class="panel clear-panel">
      <div class="action-buttons"><button id="clear-effects" class="secondary" type="button">Clear</button><button id="hit-effects" class="secondary" type="button">Hit</button></div>
    </section>
    </div>

    <section id="modifier-board" class="panel modifier-board">
      <div class="section-title"><h2>Modifiers</h2></div>
      <div class="modifier-grid">
        <div class="modifier-column" data-effect="toucher"><img class="drop" src="./effects/Toucher.svg" alt="Toucher"/><input id="modifier-toucher" type="number" min="-100" max="100" step="1" placeholder="−100 to 100"/><div><button class="modifier-charge" data-effect="toucher" data-charges="1">1</button><button class="modifier-charge" data-effect="toucher" data-charges="2">2</button><button class="modifier-charge" data-effect="toucher" data-charges="3">3</button></div></div>
        <div class="modifier-column" data-effect="critique"><img class="drop" src="./effects/Critique.svg" alt="Critique"/><input id="modifier-critique" type="number" min="-100" max="100" step="1" placeholder="−100 to 100"/><div><button class="modifier-charge" data-effect="critique" data-charges="1">1</button><button class="modifier-charge" data-effect="critique" data-charges="2">2</button><button class="modifier-charge" data-effect="critique" data-charges="3">3</button></div></div>
        <div class="modifier-column" data-effect="resistance"><img class="drop" src="./effects/Résistance.svg" alt="Résistance"/><input id="modifier-resistance" type="number" min="-100" max="100" step="1" placeholder="−100 to 100"/><div><button class="modifier-charge" data-effect="resistance" data-charges="1">1</button><button class="modifier-charge" data-effect="resistance" data-charges="2">2</button><button class="modifier-charge" data-effect="resistance" data-charges="3">3</button></div></div>
      </div>
      <div class="value-effect-column" data-effect="esquive"><img class="drop" src="./effects/Esquive.svg" alt="Esquive"/><div class="value-buttons"><button data-effect="esquive" data-value="0">0</button><button data-effect="esquive" data-value="1">1</button><button data-effect="esquive" data-value="2">2</button><button data-effect="esquive" data-value="3">3</button><button data-effect="esquive" data-value="4">4</button><button data-effect="esquive" data-value="5">5</button><button data-effect="esquive" data-value="6">6</button><button data-effect="esquive" data-value="7">7</button><button data-effect="esquive" data-value="8">8</button><button data-effect="esquive" data-value="9">9</button></div></div>
    </section>

    <section class="panel asset-import-panel">
      <button id="select-map-icons" class="secondary" type="button">Map icon setup</button>
    </section>

    <div id="effect-help" role="dialog" aria-live="polite"><strong id="effect-help-title"></strong><p id="effect-help-description"></p></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import("./main.js?rev=20261126-v016-modifiers").catch((error) => {
      console.error("Effect Tracker module failed to load:", error);
    });
  </script>
</body>
</html>
