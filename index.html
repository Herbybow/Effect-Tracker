<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effect Tracker</title>
  <link rel="stylesheet" href="./style.css?rev=20261125-v015-valued-effects-layout2" />
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><img src="./icon.svg" alt=""/><div><h1>Effect Tracker</h1></div></div>
    </header>

    <div class="character-assignment">
      <h2 id="character-name">Select a character</h2>
      <div class="character-actions"><button id="assign-character" class="assign-button" type="button" hidden>Assign</button><button id="add-to-initiative" class="assign-button initiative-button" type="button" aria-label="Add to Initiative" title="Add to Initiative" hidden>+</button></div>
    </div>

    <section class="panel">
      <div class="section-title"><h2>Current</h2></div>
      <div id="current-effects" class="empty">Select a character token on the map, then press Assign to see its current effects.</div>
    </section>

    <div id="bleed-controls" class="bleed-controls">
      <div class="effect-columns">
        <div class="effect-column effect-bleed">
          <img class="drop" src="./effects/Bleed.svg" alt="Bleed" />
          <div class="tiers">
            <button data-effect="bleed" data-tier="1">3×1</button>
            <button data-effect="bleed" data-tier="2">3×2</button>
            <button data-effect="bleed" data-tier="3">3×3</button>
            <button data-effect="bleed" data-tier="4">3×4</button>
            <button data-effect="bleed" data-tier="5">3×5</button>
          </div>
        </div>
        <div class="effect-column effect-poison">
          <img class="drop" src="./effects/Poison.svg" alt="Poison" />
          <div class="tiers">
            <button data-effect="poison" data-tier="1">3×1</button>
            <button data-effect="poison" data-tier="2">3×2</button>
            <button data-effect="poison" data-tier="3">3×3</button>
            <button data-effect="poison" data-tier="4">3×4</button>
            <button data-effect="poison" data-tier="5">3×5</button>
          </div>
        </div>
        <div class="effect-column effect-fire">
          <img class="drop" src="./effects/Fire.svg" alt="Fire" />
          <div class="tiers">
            <button data-effect="fire" data-tier="1">3×1</button>
            <button data-effect="fire" data-tier="2">3×2</button>
            <button data-effect="fire" data-tier="3">3×3</button>
            <button data-effect="fire" data-tier="4">3×4</button>
            <button data-effect="fire" data-tier="5">3×5</button>
          </div>
        </div>
        <div class="effect-column effect-regen">
          <img class="drop" src="./effects/Regen.svg" alt="Regen" />
          <div class="tiers">
            <button data-effect="regen" data-tier="1">3×1</button>
            <button data-effect="regen" data-tier="2">3×2</button>
            <button data-effect="regen" data-tier="3">3×3</button>
            <button data-effect="regen" data-tier="4">3×4</button>
            <button data-effect="regen" data-tier="5">3×5</button>
          </div>
        </div>
      </div>
      <div class="value-effect-board">
        <div class="value-effect-column" data-effect="stunt"><img class="drop" src="./effects/Stunt.svg" alt="Stunt"/><div class="value-buttons"><button data-effect="stunt" data-value="0">0</button><button data-effect="stunt" data-value="1">1</button><button data-effect="stunt" data-value="2">2</button><button data-effect="stunt" data-value="3">3</button><button data-effect="stunt" data-value="4">4</button><button data-effect="stunt" data-value="5">5</button><button data-effect="stunt" data-value="6">6</button><button data-effect="stunt" data-value="7">7</button><button data-effect="stunt" data-value="8">8</button><button data-effect="stunt" data-value="9">9</button></div></div>
        <div class="value-effect-column" data-effect="root"><img class="drop" src="./effects/Root.svg" alt="Root"/><div class="value-buttons"><button data-effect="root" data-value="0">0</button><button data-effect="root" data-value="1">1</button><button data-effect="root" data-value="2">2</button><button data-effect="root" data-value="3">3</button><button data-effect="root" data-value="4">4</button><button data-effect="root" data-value="5">5</button><button data-effect="root" data-value="6">6</button><button data-effect="root" data-value="7">7</button><button data-effect="root" data-value="8">8</button><button data-effect="root" data-value="9">9</button></div></div>
        <div class="value-effect-column" data-effect="blind"><img class="drop" src="./effects/Blind.svg" alt="Blind"/><div class="value-buttons"><button data-effect="blind" data-value="0">0</button><button data-effect="blind" data-value="1">1</button><button data-effect="blind" data-value="2">2</button><button data-effect="blind" data-value="3">3</button><button data-effect="blind" data-value="4">4</button><button data-effect="blind" data-value="5">5</button><button data-effect="blind" data-value="6">6</button><button data-effect="blind" data-value="7">7</button><button data-effect="blind" data-value="8">8</button><button data-effect="blind" data-value="9">9</button></div></div>
        <div class="value-effect-column" data-effect="silent"><img class="drop" src="./effects/Silent.svg" alt="Silent"/><div class="value-buttons"><button data-effect="silent" data-value="0">0</button><button data-effect="silent" data-value="1">1</button><button data-effect="silent" data-value="2">2</button><button data-effect="silent" data-value="3">3</button><button data-effect="silent" data-value="4">4</button><button data-effect="silent" data-value="5">5</button><button data-effect="silent" data-value="6">6</button><button data-effect="silent" data-value="7">7</button><button data-effect="silent" data-value="8">8</button><button data-effect="silent" data-value="9">9</button></div></div>
      </div>
    </div>

    <section class="panel clear-panel">
      <button id="clear-effects" class="secondary" type="button">Clear</button>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import("./main.js?rev=20261125-v015-valued-effects").catch((error) => {
      console.error("Effect Tracker module failed to load:", error);
    });
  </script>
</body>
</html>
